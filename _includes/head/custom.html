<!-- Scroll-spy: highlight the masthead nav item for the section in view -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var sections = Array.from(document.querySelectorAll(".scroll-section[id]"));
  var navLinks = Array.from(document.querySelectorAll(".masthead__menu a[href*='#']"));
  if (!sections.length || !navLinks.length) return;

  var linkBySection = {};
  navLinks.forEach(function (a) {
    var hash = a.getAttribute("href").split("#")[1];
    if (hash) linkBySection[hash] = a;
  });

  function updateActive() {
    var triggerY = window.scrollY + window.innerHeight * 0.3;
    var current = sections[0];
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].offsetTop <= triggerY) current = sections[i];
    }
    navLinks.forEach(function (l) { l.classList.remove("is-active"); });
    var link = linkBySection[current.id];
    if (link) link.classList.add("is-active");
  }

  var ticking = false;
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(function () { updateActive(); ticking = false; });
      ticking = true;
    }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  updateActive();
});
</script>
